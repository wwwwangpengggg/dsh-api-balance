# dsh-api-balance 组合包补丁：把「桌面余额小窗」这一行插入 profile。
#
# 本文件是插件自己的默认层。装到某个 profile 后，想改参数请在
# $DSH_HOME/profiles/<profile>/cordis.patch.yml 里按 id 覆盖同名行，
# 或者直接改这里的默认值再重新安装。
- insert:
    - id: api-balance
      name: dsh-api-balance
      config:
        # 刷新间隔（秒），允许 10 - 3600。
        refreshSeconds: 60
        # 首次出现的位置：top-right / top-left / bottom-right / bottom-left。
        # 拖动过之后按记忆的位置显示，这个值只在没有记忆时生效。
        corner: top-right
        # 配色主题：navy / graphite / teal / plum / sunset / light / paper。
        # 这里只是【初始值】：在小窗上右键「外观」选过的会记进 state.json，优先级更高。
        theme: navy
        # 背景图文件夹。默认在 stateDir 下的 backgrounds/，把图片丢进去，
        # 右键「外观 → 图片」里就能选。留空表示用上面的默认位置。
        backgroundsDir: ''
        # 取哪个币种的余额；留空表示用接口返回的第一种。
        currency: ''
        # 到哪读 API Key：先查同名环境变量，再查凭据文件。
        credentialEnv: DEEPSEEK_API_KEY
